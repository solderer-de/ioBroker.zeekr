version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
  - package-ecosystem: github-actions
    directory: /.github/workflows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
