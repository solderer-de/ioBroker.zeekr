name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Create release archive
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          npm pack --pack-destination dist
          PACKED_ARCHIVE=$(find dist -maxdepth 1 -type f -name 'iobroker*.tgz' | head -n 1)
          if [ -z "$PACKED_ARCHIVE" ]; then
            echo "No packed archive was produced by npm pack" >&2
            exit 1
          fi
          cp "$PACKED_ARCHIVE" "dist/iobroker.zeekr-${TAG_NAME}.tgz"
          tar -czf "dist/iobroker.zeekr-${TAG_NAME}.tar.gz" \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.venv \
            --exclude=dist \
            .
          printf 'https://codeload.github.com/${{ github.repository }}/tar.gz/refs/tags/%s\n' "$TAG_NAME" > dist/install-url.txt
          cat > dist/install-command.txt <<EOF
          iobroker url https://codeload.github.com/${{ github.repository }}/tar.gz/refs/tags/${TAG_NAME} zeekr --host iobroker --debug
          EOF
          cat > dist/install-command.sh <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          iobroker url "https://codeload.github.com/${{ github.repository }}/tar.gz/refs/tags/${TAG_NAME}" zeekr --host iobroker --debug
          EOF
          chmod +x dist/install-command.sh
          echo "Install via ioBroker:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "iobroker url https://codeload.github.com/${{ github.repository }}/tar.gz/refs/tags/${TAG_NAME} zeekr --host iobroker --debug" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/iobroker.zeekr-${{ github.event.release.tag_name || github.ref_name }}.tgz
            dist/iobroker.zeekr-${{ github.event.release.tag_name || github.ref_name }}.tar.gz
            dist/install-url.txt
            dist/install-command.txt
            dist/install-command.sh
