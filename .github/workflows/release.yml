name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Create release archive
        # Single tarball for manual Admin-UI upload. URL installs use the
        # codeload tarball directly (see README), no extra helper files.
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          tar -czf "dist/iobroker.zeekr-${TAG_NAME}.tar.gz" \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.venv \
            --exclude=dist \
            .
          echo "Install via ioBroker:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "iobroker url https://codeload.github.com/${{ github.repository }}/tar.gz/refs/tags/${TAG_NAME} zeekr --host iobroker --debug" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/iobroker.zeekr-${{ github.event.release.tag_name || github.ref_name }}.tar.gz
