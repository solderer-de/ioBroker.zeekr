name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Extract changelog for release notes
        id: notes
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          python3 - "$TAG_NAME" "$VERSION" << 'PYEOF'
          import re, subprocess, sys
          tag, version = sys.argv[1], sys.argv[2]
          text = open('README.md', encoding='utf-8').read()
          m = re.search(rf'^### {re.escape(version)}\s*\n(.*?)(?=^### |\Z)', text, re.M | re.S)
          section = m.group(1).strip() if m else ''
          try:
              prev = subprocess.run(
                  ['git', 'describe', '--tags', '--abbrev=0', 'HEAD~1'],
                  capture_output=True, text=True, check=True,
              ).stdout.strip()
          except Exception:
              prev = ''
          lines = []
          if section:
              lines.append(section)
              lines.append('')
          lines.append(
              '**Full Changelog**: https://github.com/${{ github.repository }}/compare/'
              + (f'{prev}...{tag}' if prev else tag)
          )
          open('release-notes.md', 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          print('\n'.join(lines)[:500])
          PYEOF
      - name: Create release archive
        # Single tarball for manual Admin-UI upload. URL installs use the
        # codeload tarball directly (see README), no extra helper files.
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          tar -czf "dist/iobroker.zeekr-${TAG_NAME}.tar.gz" \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.venv \
            --exclude=dist \
            .
          echo "Install via ioBroker:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "iobroker url https://codeload.github.com/${{ github.repository }}/tar.gz/refs/tags/${TAG_NAME} zeekr --host iobroker --debug" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: ${{ github.event.release.tag_name || github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            dist/iobroker.zeekr-${{ github.event.release.tag_name || github.ref_name }}.tar.gz
