name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Create release archive
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          npm pack --pack-destination dist
          mv "dist/iobroker.zeekr-${TAG_NAME#v}.tgz" "dist/iobroker-adapter-zeekr-${TAG_NAME}.tgz"
          tar -czf "dist/iobroker-adapter-zeekr-${TAG_NAME}.tar.gz" \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.venv \
            --exclude=dist \
            .
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: ${{ github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/iobroker-adapter-zeekr-${{ github.event.release.tag_name || github.ref_name }}.tgz
            dist/iobroker-adapter-zeekr-${{ github.event.release.tag_name || github.ref_name }}.tar.gz
