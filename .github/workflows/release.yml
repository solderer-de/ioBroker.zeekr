name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Create release archive
        run: |
          mkdir -p dist
          tar -czf dist/zeekr-adapter-${GITHUB_REF_NAME}.tar.gz --exclude=.git --exclude=node_modules --exclude=.venv .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/zeekr-adapter-${{ github.ref_name }}.tar.gz
