name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Create release archive
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          tar -czf "dist/iobroker.zekr-${TAG_NAME}.tar.gz" --exclude=.git --exclude=node_modules --exclude=.venv .
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/iobroker.zekr-${{ github.event.release.tag_name || github.ref_name }}.tar.gz
          append_body: true
